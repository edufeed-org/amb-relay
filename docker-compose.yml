services:
  typesense:
    image: typesense/typesense:28.0
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    command: '--data-dir /data --api-key=${TS_APIKEY} --enable-cors'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 95k events + chunk embeddings can push TS RSS past 3 GiB during WAL replay.
    # Cap so an OOM kills the container instead of swap-thrashing the host (see
    # 2026-06-11 oersi-dev runaway). Bump if WAL replay logs OOMs.
    mem_limit: 4g
    mem_reservation: 1g

  amb-relay:
    build:
      context: .
    restart: on-failure
    ports:
      - "3334:3334"
    depends_on:
      typesense:
        condition: service_healthy
      embed:
        condition: service_healthy
    # BoltDB lives at /root/data/relay.db (DB_PATH default). Without this
    # named volume, the database is in the container layer and gets wiped
    # on every rebuild, leaving Typesense docs orphaned with no raw store
    # entry — which silently breaks REQ for those events.
    volumes:
      - relay_data:/root/data
    environment:
      - NAME=${NAME}
      - PUBKEY=${PUBKEY}
      - DESCRIPTION=${DESCRIPTION}
      - ICON=${ICON}
      - TS_APIKEY=${TS_APIKEY}
      - TS_HOST=http://typesense:8108
      - TS_COLLECTION=${TS_COLLECTION}
      - EMBED_ENDPOINT=${EMBED_ENDPOINT}
      - EMBED_TOKEN=${EMBED_TOKEN}
      - SEMANTIC_SEARCH_ENABLED=${SEMANTIC_SEARCH_ENABLED:-false}
      - ADMIN_PUBKEYS=${ADMIN_PUBKEYS}
      # Chunk-level re-ranking of NIP-50 searches via amb-indexer's
      # /search_chunks. Token must match INDEXER_API_TOKEN in
      # ../amb-indexer/.env.indexer. Falls back to plain search when the
      # indexer is unreachable.
      - CHUNK_RERANK_ENABLED=${CHUNK_RERANK_ENABLED:-false}
      - INDEXER_BASE_URL=${INDEXER_BASE_URL:-http://amb-indexer:8080}
      - INDEXER_API_TOKEN=${INDEXER_API_TOKEN}
    mem_limit: 1g
    mem_reservation: 256m

  tika:
    image: apache/tika:latest-full
    restart: unless-stopped
    # No port exposure to host; reachable only on the internal network.
    mem_limit: 1g
    mem_reservation: 256m

  embed:
    build: ./embed
    restart: unless-stopped
    environment:
      - EMBED_TOKEN=${EMBED_TOKEN}
    volumes:
      - embed_model_cache:/cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8100/health\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Model load on first boot pulls ~120 MB and takes time. Generous start_period
      # avoids tripping unhealthy during cold start.
      start_period: 120s
    # Model + activations fit comfortably under 2 GiB; the 2026-06-11 runaway
    # climbed to ~2.0 GB RSS before the host died, so this is a hard ceiling
    # for a single uvicorn worker. Don't raise without also revisiting the
    # retry-amplification fix in nostrlib (replace.go).
    mem_limit: 2g
    mem_reservation: 512m
    # No port exposure to host by default; reachable only on the internal network.
    # Uncomment for host-side debugging:
    # ports:
    #   - "8100:8100"

  # One-shot init: chown the indexer's BoltDB volume to nonroot uid 65532
  # (the amb-indexer image runs as distroless nonroot). Without this the
  # indexer can't write /data/indexer.db on a fresh deployment.
  amb-indexer-initdata:
    image: busybox:1.36
    command: chown -R 65532:65532 /data
    volumes:
      - indexer_data:/data
    restart: "no"

  amb-indexer:
    build: ../amb-indexer
    restart: unless-stopped
    depends_on:
      amb-indexer-initdata:
        condition: service_completed_successfully
      amb-relay:
        condition: service_started
      typesense:
        condition: service_healthy
      tika:
        condition: service_started
      embed:
        condition: service_healthy
    env_file: ../amb-indexer/.env.indexer
    volumes:
      - indexer_data:/data
    mem_limit: 1g
    mem_reservation: 256m

volumes:
  indexer_data:
  embed_model_cache:
  relay_data:
