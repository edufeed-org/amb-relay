services:
  typesense:
    image: typesense/typesense:28.0
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    command: '--data-dir /data --api-key=${TS_APIKEY} --enable-cors'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 95k events + chunk embeddings can push TS RSS past 3 GiB during WAL replay.
    # Cap so an OOM kills the container instead of swap-thrashing the host (see
    # 2026-06-11 oersi-dev runaway). Bump if WAL replay logs OOMs.
    mem_limit: 4g
    mem_reservation: 1g

  amb-relay:
    build:
      context: .
    restart: on-failure
    ports:
      - "3334:3334"
    depends_on:
      typesense:
        condition: service_healthy
      embed:
        condition: service_healthy
    # BoltDB lives at /root/data/relay.db (DB_PATH default). Without this
    # named volume, the database is in the container layer and gets wiped
    # on every rebuild, leaving Typesense docs orphaned with no raw store
    # entry — which silently breaks REQ for those events.
    volumes:
      - relay_data:/root/data
    # Pass .env through wholesale. This used to be a hand-maintained list of
    # individual variables, which silently dropped every var not on it — all
    # seven content-type flags, every TS_COLLECTION_*, DB_PATH, SERVICE_URL,
    # PROFILE_*, COMMUNITY_*, QUERY_FETCH_TIMEOUT_MS and HYDRATE_ON_START.
    # Setting them in .env per .env.example did nothing. Every var the relay
    # reads is documented in .env.example; anything absent falls back to the
    # code default.
    env_file:
      # required:false keeps `docker compose up` working before the
      # `cp .env.example .env` step in the README's Quick Start.
      - path: .env
        required: false
    # environment: wins over env_file:, so this override survives. It is the
    # only value compose must override: .env points TS_HOST at the host port
    # for local `go run .` development, but in-stack the relay reaches
    # Typesense over the compose network.
    environment:
      - TS_HOST=http://typesense:8108
    mem_limit: 1g
    mem_reservation: 256m

  tika:
    image: apache/tika:latest-full
    restart: unless-stopped
    # No port exposure to host; reachable only on the internal network.
    mem_limit: 1g
    mem_reservation: 256m

  embed:
    build: ./embed
    restart: unless-stopped
    environment:
      - EMBED_TOKEN=${EMBED_TOKEN}
      - EMBED_MODEL=intfloat/multilingual-e5-base
    volumes:
      - embed_model_cache:/cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8100/health\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot pulls ~1.1 GB (e5-base) and loads it; allow a long cold start.
      start_period: 300s
    # e5-base is ~1.1 GB resident; activations add headroom. The 2026-06-11
    # runaway (retry-amplification, since fixed in nostrlib replace.go) hit
    # ~2.0 GB RSS, so keep a hard ceiling but above the model footprint.
    mem_limit: 3g
    mem_reservation: 1g
    # No port exposure to host by default; reachable only on the internal network.
    # Uncomment for host-side debugging:
    # ports:
    #   - "8100:8100"

  # One-shot init: chown the indexer's BoltDB volume to nonroot uid 65532
  # (the amb-indexer image runs as distroless nonroot). Without this the
  # indexer can't write /data/indexer.db on a fresh deployment.
  amb-indexer-initdata:
    image: busybox:1.36
    command: chown -R 65532:65532 /data
    volumes:
      - indexer_data:/data
    restart: "no"

  amb-indexer:
    build: ../amb-indexer
    restart: unless-stopped
    depends_on:
      amb-indexer-initdata:
        condition: service_completed_successfully
      amb-relay:
        condition: service_started
      typesense:
        condition: service_healthy
      tika:
        condition: service_started
      embed:
        condition: service_healthy
    env_file: ../amb-indexer/.env.indexer
    volumes:
      - indexer_data:/data
    mem_limit: 1g
    mem_reservation: 256m

volumes:
  indexer_data:
  embed_model_cache:
  relay_data:
