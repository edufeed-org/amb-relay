services:
  # Stub out the in-cluster amb-relay; we'll run it on the host via `go run .`.
  # Use a no-op container so depends_on references still resolve, but the
  # service exits immediately without competing for port 3334.
  amb-relay:
    image: busybox:1.36
    build: !reset null
    command: ["true"]
    restart: "no"
    ports: !reset []
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s

  amb-indexer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RELAY_URL: "ws://host.docker.internal:3334"
      RELAY_NIP86_URL: "http://host.docker.internal:3334/"
